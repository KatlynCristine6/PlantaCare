<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>PlantaCare</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<main class="tela-inicial">


    <section class="logo">

        <div class="logo-folha">
            🌿
        </div>

        <h1>PlantaCare</h1>

        <p>Sua planta, nosso cuidado</p>

    </section>

    <section class="planta-area">

        <img
                src="images/vaso-plantacare.png"
                alt="Vaso inteligente PlantaCare"
                class="imagem-vaso"
        >

    </section>

    <section class="acoes">

        <button id="btnComecar">
            Começar
        </button>

        <p class="login">
            Já tem uma conta?
            <span id="btnLogin">Entrar</span>
        </p>

    </section>



</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>

</html>
