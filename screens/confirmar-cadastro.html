<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Confirmar cadastro - PlantaCare</title>

    <link
            rel="stylesheet"
            href="../css/confirmar-cadastro.css"
    >

</head>

<body>

<main class="tela-confirmacao">

    <div class="confirmacao-container">

        <!-- LOGO -->

        <div class="logo">

            <div class="folhas-logo">
                🌿
            </div>

            <h1>PlantaCare</h1>

            <p>Sua planta, nosso cuidado</p>

        </div>


        <!-- TÍTULO -->

        <h2>Confira seus dados</h2>

        <p class="subtitulo">
            Verifique se todas as informações estão corretas.
        </p>


        <!-- DADOS -->

        <div class="dados">

            <div class="dado">
                <span>Nome</span>
                <strong id="confirmaNome"></strong>
            </div>

            <div class="dado">
                <span>E-mail</span>
                <strong id="confirmaEmail"></strong>
            </div>

            <div class="dado">
                <span>Telefone</span>
                <strong id="confirmaTelefone"></strong>
            </div>

            <div class="dado">
                <span>Quantidade de plantas</span>
                <strong id="confirmaPlantas"></strong>
            </div>

        </div>


        <!-- CADASTRAR -->

        <button
                type="button"
                class="btn-cadastrar"
                id="btnCadastrar"
        >
            Cadastrar
        </button>


        <!-- VOLTAR -->

        <button
                type="button"
                class="btn-voltar"
                id="btnVoltar"
        >
            Voltar e editar
        </button>

    </div>


    <!-- FOLHAS -->

    <div class="folhas-inferiores">

        <div class="folhas-esquerda">
            🌿
        </div>

        <div class="folhas-direita">
            🌿
        </div>

    </div>

</main>


<script src="../js/confirmar-cadastro.js"></script>

</body>

</html>
